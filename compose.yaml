services:
  food-preorder:
    build:
      context: .
      dockerfile: Dockerfile
    image: food-preorder:latest
    container_name: food-preorder
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - default
      - traefik_public
    volumes:
      - food-preorder-data:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}
      - traefik.http.routers.food-preorder.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.food-preorder.entrypoints=websecure
      - traefik.http.routers.food-preorder.tls=true
      - traefik.http.routers.food-preorder.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.food-preorder.priority=10
      - traefik.http.services.food-preorder.loadbalancer.server.port=3000

networks:
  traefik_public:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}

volumes:
  food-preorder-data:
    name: food-preorder-data
